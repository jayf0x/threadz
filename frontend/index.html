<!doctype html>
<html lang="en" data-palette="ochre-paper">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Threadz" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f5ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1917" media="(prefers-color-scheme: dark)" />
    <title>Threadz</title>
    <script>
      // Pre-paint theme: single writer for the root class, so no flash.
      // React only ever calls window._setTheme.
      (function () {
        var root = document.documentElement;
        var theme = localStorage.getItem("threadz-theme") || "system";
        root.classList.remove("light", "dark", "system");
        root.classList.add(theme);
        window._setTheme = function (t) {
          if (!t) { localStorage.removeItem("threadz-theme"); t = "system"; }
          else { localStorage.setItem("threadz-theme", t); }
          root.classList.remove("light", "dark", "system");
          root.classList.add(t);
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
