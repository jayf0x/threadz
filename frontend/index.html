<!doctype html>
<html lang="en" data-palette="gruvbox-light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Threadz" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f5ee" />
    <title>Threadz</title>
    <script>
      // Pre-paint theme + palette: single writer for the root class/attribute, so no flash.
      // React only ever calls window._setTheme / window._setPalette (ui/theme-toggle.tsx,
      // features/settings/sections/AppearanceSection.tsx). PALETTE_BG is a rough hex stand-in for
      // each palette's real --background (themes/*.css) — good enough for the browser-chrome
      // color, which can't read a CSS var before that stylesheet is guaranteed loaded.
      (function () {
        var PALETTE_BG = {
          "gruvbox-light": { light: "#f8f5ee", dark: "#1b1917" },
          "one-light": { light: "#f4f6f9", dark: "#15171c" },
          everforest: { light: "#f3f7f2", dark: "#121714" },
          "solarized-light": { light: "#fdf6e3", dark: "#00272f" },
          "night-owl": { light: "#011627", dark: "#011627" },
          dracula: { light: "#282a36", dark: "#282a36" },
          nord: { light: "#2e3440", dark: "#2e3440" },
          "gruvbox-dark": { light: "#282828", dark: "#282828" },
          ubuntu: { light: "#300a24", dark: "#300a24" },
          monokai: { light: "#272822", dark: "#272822" },
          catppuccin: { light: "#1e1e2e", dark: "#1e1e2e" },
          "one-dark": { light: "#282c34", dark: "#282c34" },
        };
        var root = document.documentElement;
        var theme = localStorage.getItem("threadz-theme") || "system";
        var palette = localStorage.getItem("threadz-palette") || "gruvbox-light";

        function syncMeta() {
          var meta = document.querySelector('meta[name="theme-color"]');
          if (!meta) return;
          var dark = theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          var bg = PALETTE_BG[palette] || PALETTE_BG["gruvbox-light"];
          meta.setAttribute("content", dark ? bg.dark : bg.light);
        }

        root.classList.remove("light", "dark", "system");
        root.classList.add(theme);
        root.setAttribute("data-palette", palette);
        syncMeta();

        window._setTheme = function (t) {
          if (!t) { localStorage.removeItem("threadz-theme"); t = "system"; }
          else { localStorage.setItem("threadz-theme", t); }
          theme = t;
          root.classList.remove("light", "dark", "system");
          root.classList.add(t);
          syncMeta();
        };
        window._setPalette = function (p) {
          localStorage.setItem("threadz-palette", p);
          palette = p;
          root.setAttribute("data-palette", p);
          syncMeta();
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
