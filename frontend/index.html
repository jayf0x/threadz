<!doctype html>
<html lang="en" data-palette="gruvbox">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Threadz" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f5ee" />
    <title>Threadz</title>
    <script>
      // Pre-paint theme + palette: single writer for the root class/attribute, so no flash.
      // React only ever calls window._setTheme / window._setPalette (ui/theme-toggle.tsx,
      // features/settings/sections/AppearanceSection.tsx). PALETTE_BG is a rough hex stand-in for
      // each palette's real --background per mode (themes/*.css) — good enough for the browser-chrome
      // color, which can't read a CSS var before that stylesheet is guaranteed loaded.
      (function () {
        var PALETTE_BG = {
          gruvbox: { light: "#f8f5ee", dark: "#1b1917" },
          one: { light: "#f4f6f9", dark: "#15171c" },
          everforest: { light: "#f3f7f2", dark: "#121714" },
          solarized: { light: "#fdf6e3", dark: "#00272f" },
          catppuccin: { light: "#eff1f5", dark: "#1e1e2e" },
          nord: { light: "#eceff4", dark: "#2e3440" },
        };
        // Palettes used to be split into light/dark identities (gruvbox-light/-dark, always-dark
        // dracula…). They're colour families now and the Light/System/Dark toggle picks the mode, so an
        // old stored id maps to its family — and one that was a dark identity keeps looking dark.
        var LEGACY = {
          "gruvbox-light": ["gruvbox"], "gruvbox-dark": ["gruvbox", true],
          "one-light": ["one"], "one-dark": ["one", true],
          "solarized-light": ["solarized"],
          "night-owl": ["nord", true], dracula: ["catppuccin", true], ubuntu: ["gruvbox", true], monokai: ["gruvbox", true],
        };
        var root = document.documentElement;
        var theme = localStorage.getItem("threadz-theme") || "system";
        var palette = localStorage.getItem("threadz-palette") || "gruvbox";
        var legacy = LEGACY[palette];
        if (legacy) {
          palette = legacy[0];
          localStorage.setItem("threadz-palette", palette);
          if (legacy[1]) { theme = "dark"; localStorage.setItem("threadz-theme", theme); }
        }
        if (!PALETTE_BG[palette]) palette = "gruvbox";

        function syncMeta() {
          var meta = document.querySelector('meta[name="theme-color"]');
          if (!meta) return;
          var dark = theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          var bg = PALETTE_BG[palette] || PALETTE_BG.gruvbox;
          meta.setAttribute("content", dark ? bg.dark : bg.light);
        }

        root.classList.remove("light", "dark", "system");
        root.classList.add(theme);
        root.setAttribute("data-palette", palette);
        syncMeta();

        window._setTheme = function (t) {
          if (!t) { localStorage.removeItem("threadz-theme"); t = "system"; }
          else { localStorage.setItem("threadz-theme", t); }
          theme = t;
          root.classList.remove("light", "dark", "system");
          root.classList.add(t);
          syncMeta();
        };
        window._setPalette = function (p) {
          localStorage.setItem("threadz-palette", p);
          palette = p;
          root.setAttribute("data-palette", p);
          syncMeta();
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
