<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>sqlite-wasm spike</title>
  </head>
  <body>
    <script type="module">
      const worker = new Worker("/worker.js", { type: "module" });
      window.__spikeDone = false;
      worker.addEventListener("message", (ev) => {
        window.__spikeResult = ev.data.report;
        // Bytes come back as a transferred ArrayBuffer; stash as base64 so
        // Playwright can pull them out with a plain evaluate() call.
        if (ev.data.bytes) {
          let binary = "";
          const bytes = ev.data.bytes;
          for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
          window.__spikeBytesBase64 = btoa(binary);
        } else {
          window.__spikeBytesBase64 = null;
        }
        window.__spikeDone = true;
      });
      worker.addEventListener("error", (ev) => {
        window.__spikeResult = { ok: false, steps: [], workerError: ev.message };
        window.__spikeDone = true;
      });
    </script>
  </body>
</html>
